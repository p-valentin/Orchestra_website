# Minimal Supabase CLI config — unspecified sections use CLI defaults.
project_id = "orchestra-license"

# Unverified throwaway signups must not get trials (Phase 1.5). Mirror this
# in the hosted dashboard: Auth → Email → "Confirm email".
# Where auth links land. The Site URL is the FALLBACK for any email that does
# not carry an explicit redirect — password resets triggered outside the site,
# a resend through the API, anything Supabase generates itself. It was pointing
# at http://127.0.0.1:3000, so those links sent real customers to a localhost
# address that only exists on a developer's machine.
#
# The signup form passes emailRedirectTo=/welcome explicitly, but that only
# works if the URL is in the allow-list below — otherwise Supabase silently
# falls back to site_url, which is exactly how this stayed invisible.
#
# Unlike [auth.email.template.*], these DO apply to the hosted project via
# `supabase config push`.
[auth]
site_url = "https://www.orchestra-automation.com"
additional_redirect_urls = [
  "https://www.orchestra-automation.com/welcome",
  "https://www.orchestra-automation.com/reset-password",
  "https://orchestra-automation.com/welcome",
  "https://orchestra-automation.com/reset-password",
  # Local development, so the same flows can be exercised without editing this.
  "http://localhost:3000/welcome",
  "http://localhost:3000/reset-password",
  "http://127.0.0.1:3000/welcome",
  "http://127.0.0.1:3000/reset-password",
]

[auth.email]
enable_confirmations = true

# Branded auth emails. These are the FIRST mail anyone gets from Orchestra —
# before any purchase confirmation — so leaving them on Supabase's default
# template made the account flow look unrelated to the product people had just
# downloaded. Same shell as the purchase/refund emails in
# functions/_shared/resend.ts: dark panel, brass accent, one clear action, and
# the raw link underneath for clients that swallow the button.
#
# ⚠ THESE APPLY TO LOCAL DEVELOPMENT ONLY.
# `supabase config push` reports auth as "updated" and silently ignores the
# templates: on a HOSTED project they live in the dashboard (Authentication →
# Emails) or must be set through the Management API. Editing the files below
# changes nothing in production — keep them in step with whatever production
# is actually serving, or they become a lie that reads like a source of truth.
# Paths are relative to the PROJECT ROOT, not to this file.
[auth.email.template.confirmation]
subject = "Confirm your Orchestra account"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "Reset your Orchestra password"
content_path = "./supabase/templates/reset-password.html"

[auth.email.template.email_change]
subject = "Confirm your new Orchestra email"
content_path = "./supabase/templates/change-email.html"

# entitlement and claim-legacy require a valid Supabase Auth JWT; the gateway
# rejects unauthenticated requests before they reach the function (verify_jwt
# is the default — spelled out because the endpoints are useless without it).
[functions.entitlement]
verify_jwt = true

# The browser calls devices cross-origin from /account, and its OPTIONS
# preflight carries no Authorization header — gateway JWT verification would
# 401 the preflight and break the page. The function authenticates every
# non-OPTIONS request itself (authenticateRequest), so nothing is left open.
[functions.devices]
verify_jwt = false

[functions.claim-legacy]
verify_jwt = true

# Public endpoint: Paddle can't send a Supabase JWT. Authentication is the
# Paddle-Signature HMAC verified inside the function.
[functions.webhooks-paddle]
verify_jwt = false

# Same for Polar: a Standard Webhooks delivery carries no Supabase JWT.
# Authentication is the webhook-signature HMAC verified inside the function,
# before the body is parsed.
[functions.webhooks-polar]
verify_jwt = false

# The browser calls refund-request cross-origin from /account, and its OPTIONS
# preflight carries no Authorization header — gateway JWT verification would
# 401 the preflight. The function authenticates every non-OPTIONS request
# itself and derives the licence from the caller's own JWT, never from the
# request body.
[functions.refund-request]
verify_jwt = false

# Called by the WEBSITE'S SERVER, which holds no Supabase user session, so the
# gateway has no JWT to check. Authentication is an HMAC signature over the
# method, path, body and a timestamp, verified inside the function — see
# _shared/admin-auth.ts for why a static bearer token was rejected. Every
# failure returns 404, so this endpoint does not advertise itself.
[functions.admin-data]
verify_jwt = false
